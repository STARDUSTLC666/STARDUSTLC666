<svg xmlns="http://www.w3.org/2000/svg" width="840" height="304" viewBox="0 0 840 304" role="img" aria-label="STARDUST - AI Systems and Harness Engineering">
  <defs>
    <style>
      @keyframes prismSweep {
        0%, 100% { transform: translateX(-140px); opacity: 0.55; }
        50% { transform: translateX(140px); opacity: 1; }
      }
      .beam { animation: prismSweep 7s ease-in-out infinite; }
      @media (prefers-reduced-motion: reduce) {
        .beam { animation: none; }
      }
    </style>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#121624"/>
      <stop offset="62%" stop-color="#161B2E"/>
      <stop offset="100%" stop-color="#1C2238"/>
    </linearGradient>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#94A3B8" fill-opacity="0.22"/>
    </pattern>
    <radialGradient id="dotFade" cx="50%" cy="40%" r="52%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <mask id="dotMask">
      <rect width="840" height="304" fill="url(#dotFade)"/>
    </mask>
    <linearGradient id="wordmark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="94%" r="52%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.28"/>
      <stop offset="46%" stop-color="#F472B6" stop-opacity="0.16"/>
      <stop offset="82%" stop-color="#38BDF8" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#121624" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#252E42" stop-opacity="0"/>
      <stop offset="26%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="74%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#252E42" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="frame">
      <rect width="840" height="304" rx="16"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="840" height="304" fill="url(#sky)"/>
    <rect width="840" height="304" fill="url(#dots)" mask="url(#dotMask)"/>
    <rect width="840" height="304" fill="url(#halo)"/>
    <line x1="160" y1="1" x2="680" y2="1" stroke="url(#rim)" stroke-width="1.5" opacity="0.65"/>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" letter-spacing="2.5" fill="#94A3B8">
      <text x="36" y="38">STARDUSTLC666</text>
      <text x="804" y="38" text-anchor="end">DEEPSEEK HARNESS · 18+ MODULES</text>
    </g>

    <text x="420" y="134" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="54" font-weight="800" letter-spacing="10" fill="url(#wordmark)">STARDUST</text>

    <text x="420" y="170" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', 'Segoe UI', sans-serif" font-size="14.5" font-weight="500" letter-spacing="1" fill="#CBD5E1">把模糊的 AI 需求，构筑为可运行、可复核、可交付的系统。</text>

    <text x="420" y="200" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" letter-spacing="4" fill="#64748B">EXECUTABLE   /   VERIFIABLE   /   MAINTAINABLE</text>

    <ellipse cx="420" cy="488" rx="560" ry="246" fill="#0E121E" stroke="#252E42" stroke-width="1.5"/>
    <ellipse cx="420" cy="488" rx="560" ry="246" fill="none" stroke="url(#rim)" stroke-width="2" opacity="0.82"/>
    <g class="beam">
      <ellipse cx="420" cy="488" rx="560" ry="246" fill="none" stroke="url(#rim)" stroke-width="3.2"/>
    </g>
  </g>
  <rect x="0.75" y="0.75" width="838.5" height="302.5" rx="15.25" fill="none" stroke="#2B344A" stroke-width="1.5"/>
</svg>
